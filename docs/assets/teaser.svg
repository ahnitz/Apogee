<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="900" height="490" rx="8" fill="#0b0f19"/>
<text x="28" y="34" font-size="17" font-weight="600" fill="#e8eef7">16384 correlations of 4096 points</text>
<text x="28" y="55" font-size="12.5" fill="#94a3b8">correlations per second — taller is better. The two panels have DIFFERENT scales.</text>
<text x="28" y="76" font-size="11" fill="#94a3b8"><tspan fill="#e8eef7">CPU</tspan><tspan dx="7">AMD RYZEN AI MAX+ 395 w/ Radeon 8060S</tspan><tspan dx="24" fill="#e8eef7">GPU</tspan><tspan dx="7">AMD Radeon 8060S Graphics (RADV GFX1151)</tspan></text>
<text x="60" y="104" font-size="13" font-weight="600" fill="#e8eef7">CPU</text>
<line x1="60" y1="370" x2="440" y2="370" stroke="#243044"/>
<rect x="86" y="346.4" width="86" height="23.6" rx="3" fill="#94a3b8"/>
<text x="129" y="326.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8eef7">163k/s</text>
<text x="129" y="339.4" font-size="10.5" text-anchor="middle" fill="#94a3b8">100.61 ms</text>
<text x="129" y="388" font-size="11.5" text-anchor="middle" fill="#e8eef7">FFTW (patient)</text>
<text x="129" y="401" font-size="9.5" text-anchor="middle" fill="#94a3b8">ifft only</text>
<rect x="212" y="323.1" width="86" height="46.9" rx="3" fill="#4facfe"/>
<text x="255" y="303.1" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8eef7">323k/s</text>
<text x="255" y="316.1" font-size="10.5" text-anchor="middle" fill="#94a3b8">50.73 ms</text>
<text x="255" y="388" font-size="11.5" text-anchor="middle" fill="#e8eef7">matchedfilter</text>
<text x="255" y="401" font-size="9.5" text-anchor="middle" fill="#94a3b8">correlate + ifft + peak</text>
<rect x="338" y="120.0" width="86" height="250.0" rx="3" fill="#38ef7d"/>
<text x="381" y="100.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8eef7">1.7M/s</text>
<text x="381" y="113.0" font-size="10.5" text-anchor="middle" fill="#94a3b8">9.52 ms</text>
<text x="381" y="388" font-size="11.5" text-anchor="middle" fill="#e8eef7">matchedfilter</text>
<text x="381" y="401" font-size="11.5" text-anchor="middle" fill="#e8eef7">hierarchical</text>
<text x="381" y="414" font-size="9.5" text-anchor="middle" fill="#94a3b8">correlate + ifft + peak</text>
<text x="510" y="104" font-size="13" font-weight="600" fill="#e8eef7">GPU</text>
<line x1="510" y1="370" x2="890" y2="370" stroke="#243044"/>
<rect x="536" y="352.1" width="86" height="17.9" rx="3" fill="#94a3b8"/>
<text x="579" y="332.1" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8eef7">3.2M/s</text>
<text x="579" y="345.1" font-size="10.5" text-anchor="middle" fill="#94a3b8">5.06 ms</text>
<text x="579" y="388" font-size="11.5" text-anchor="middle" fill="#e8eef7">rocFFT</text>
<text x="579" y="401" font-size="9.5" text-anchor="middle" fill="#94a3b8">ifft only — at the bandwidth limit</text>
<rect x="662" y="296.9" width="86" height="73.1" rx="3" fill="#4facfe"/>
<text x="705" y="276.9" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8eef7">13.2M/s</text>
<text x="705" y="289.9" font-size="10.5" text-anchor="middle" fill="#94a3b8">1.24 ms</text>
<text x="705" y="388" font-size="11.5" text-anchor="middle" fill="#e8eef7">matchedfilter</text>
<text x="705" y="401" font-size="9.5" text-anchor="middle" fill="#94a3b8">correlate + ifft + peak</text>
<rect x="788" y="120.0" width="86" height="250.0" rx="3" fill="#38ef7d"/>
<text x="831" y="100.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8eef7">45.1M/s</text>
<text x="831" y="113.0" font-size="10.5" text-anchor="middle" fill="#94a3b8">0.36 ms</text>
<text x="831" y="388" font-size="11.5" text-anchor="middle" fill="#e8eef7">matchedfilter</text>
<text x="831" y="401" font-size="11.5" text-anchor="middle" fill="#e8eef7">hierarchical</text>
<text x="831" y="414" font-size="9.5" text-anchor="middle" fill="#94a3b8">correlate + ifft + peak</text>
<text x="28" y="460" font-size="11.5" fill="#94a3b8">FFTW and rocFFT do the inverse transform ALONE; matchedfilter does the product, the transform and the peak scan.</text>
<text x="28" y="476" font-size="11.5" fill="#94a3b8">Only the peak per bin is returned, so the 537 MB of correlation is never written — on the GPU rocFFT is at the bandwidth limit (213 of 211 GB/s).</text>
</svg>