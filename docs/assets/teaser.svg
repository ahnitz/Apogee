  <g id="text_29">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #adb9ca" x="34.56" y="61.8048" transform="rotate(-0 34.56 61.8048)">Same matched-profile bank and Gaussian noise · SNR 5.5 · full lag window</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #adb9ca" x="34.56" y="354.96" transform="rotate(-0 34.56 354.96)">Hierarchical boundaries show total throughput at each FDR budget, not additive rates. FDR is requested, not measured here.</text>
