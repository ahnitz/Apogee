<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="900" height="430" fill="none"/>
<text x="24" y="28" font-size="16" font-weight="600" fill="currentColor">16384 correlations of 4096 points</text>
<text x="24" y="48" font-size="12.5" fill="currentColor" opacity=".65">lower is better; FFT libraries are timed doing the inverse transform ALONE</text>
<text x="24" y="86" font-size="12" font-weight="600" fill="currentColor" opacity=".55">CPU</text>
<rect x="300" y="64" width="520.0" height="34" rx="3" fill="#b0b6c0"/>
<text x="288" y="80" font-size="13" text-anchor="end" fill="currentColor">FFTW (patient)</text>
<text x="288" y="93" font-size="10.5" text-anchor="end" fill="currentColor" opacity=".55">ifft only</text>
<text x="830.0" y="86" font-size="12.5" fill="currentColor" opacity=".8">106.8 ms</text>
<rect x="300" y="112" width="244.8" height="34" rx="3" fill="#4c78a8"/>
<text x="288" y="128" font-size="13" text-anchor="end" fill="currentColor">matchedfilter</text>
<text x="288" y="141" font-size="10.5" text-anchor="end" fill="currentColor" opacity=".55">correlate + ifft + peak</text>
<text x="554.8" y="134" font-size="12.5" fill="currentColor" opacity=".8">50.3 ms</text>
<rect x="300" y="160" width="32.2" height="34" rx="3" fill="#2f5d8a"/>
<text x="288" y="176" font-size="13" text-anchor="end" fill="currentColor">matchedfilter, hierarchical</text>
<text x="288" y="189" font-size="10.5" text-anchor="end" fill="currentColor" opacity=".55">correlate + ifft + peak</text>
<text x="342.2" y="182" font-size="12.5" fill="currentColor" opacity=".8">6.6 ms</text>
<text x="24" y="230" font-size="12" font-weight="600" fill="currentColor" opacity=".55">GPU</text>
<rect x="300" y="208" width="24.7" height="34" rx="3" fill="#b0b6c0"/>
<text x="288" y="224" font-size="13" text-anchor="end" fill="currentColor">rocFFT</text>
<text x="288" y="237" font-size="10.5" text-anchor="end" fill="currentColor" opacity=".55">ifft only — at the bandwidth limit</text>
<text x="334.7" y="230" font-size="12.5" fill="currentColor" opacity=".8">5.1 ms</text>
<rect x="300" y="256" width="7.2" height="34" rx="3" fill="#e6924c"/>
<text x="288" y="272" font-size="13" text-anchor="end" fill="currentColor">matchedfilter</text>
<text x="288" y="285" font-size="10.5" text-anchor="end" fill="currentColor" opacity=".55">correlate + ifft + peak</text>
<text x="317.2" y="278" font-size="12.5" fill="currentColor" opacity=".8">1.5 ms</text>
<rect x="300" y="304" width="2.0" height="34" rx="3" fill="#c26a22"/>
<text x="288" y="320" font-size="13" text-anchor="end" fill="currentColor">matchedfilter, hierarchical</text>
<text x="288" y="333" font-size="10.5" text-anchor="end" fill="currentColor" opacity=".55">correlate + ifft + peak</text>
<text x="312.0" y="326" font-size="12.5" fill="currentColor" opacity=".8">0.2 ms</text>
<text x="24" y="404" font-size="11.5" fill="currentColor" opacity=".6">matchedfilter returns only the peak per bin, so the 537 MB of correlation an FFT must write is never materialised. On the GPU that is the whole gap: rocFFT runs at 213 GB/s against a 211 GB/s copy ceiling — at the bandwidth limit.</text>
<text x="24" y="420" font-size="11.5" fill="currentColor" opacity=".6">Measured on AMD RYZEN AI MAX+ 395 w/ Radeon 8060S / AMD Radeon 8060S Graphics (RADV GFX1151).</text>
</svg>