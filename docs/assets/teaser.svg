  <g id="text_31">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #adb9ca" x="34.56" y="373.752" transform="rotate(-0 34.56 373.752)">FFTW / rocFFT: inverse FFT only. Matchedfilter: product + inverse FFT + peak; warm public API.</text>
