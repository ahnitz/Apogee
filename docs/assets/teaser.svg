<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="900" height="470" rx="8" fill="#0b0f19"/>
<text x="28" y="34" font-size="17" font-weight="600" fill="#e8eef7">16384 correlations of 4096 points</text>
<text x="28" y="55" font-size="12.5" fill="#94a3b8">correlations per second — taller is better. The two panels have DIFFERENT scales.</text>
<text x="60" y="84" font-size="13" font-weight="600" fill="#e8eef7">CPU</text>
<line x1="60" y1="350" x2="440" y2="350" stroke="#243044"/>
<rect x="86" y="334.4" width="86" height="15.6" rx="3" fill="#94a3b8"/>
<text x="129" y="314.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8eef7">154k/s</text>
<text x="129" y="327.4" font-size="10.5" text-anchor="middle" fill="#94a3b8">106.22 ms</text>
<text x="129" y="368" font-size="11.5" text-anchor="middle" fill="#e8eef7">FFTW (patient)</text>
<text x="129" y="381" font-size="9.5" text-anchor="middle" fill="#94a3b8">ifft only</text>
<rect x="212" y="317.7" width="86" height="32.3" rx="3" fill="#4facfe"/>
<text x="255" y="297.7" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8eef7">320k/s</text>
<text x="255" y="310.7" font-size="10.5" text-anchor="middle" fill="#94a3b8">51.26 ms</text>
<text x="255" y="368" font-size="11.5" text-anchor="middle" fill="#e8eef7">matchedfilter</text>
<text x="255" y="381" font-size="9.5" text-anchor="middle" fill="#94a3b8">correlate + ifft + peak</text>
<rect x="338" y="100.0" width="86" height="250.0" rx="3" fill="#38ef7d"/>
<text x="381" y="80.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8eef7">2.5M/s</text>
<text x="381" y="93.0" font-size="10.5" text-anchor="middle" fill="#94a3b8">6.63 ms</text>
<text x="381" y="368" font-size="11.5" text-anchor="middle" fill="#e8eef7">matchedfilter</text>
<text x="381" y="381" font-size="11.5" text-anchor="middle" fill="#e8eef7">hierarchical</text>
<text x="381" y="394" font-size="9.5" text-anchor="middle" fill="#94a3b8">correlate + ifft + peak</text>
<text x="510" y="84" font-size="13" font-weight="600" fill="#e8eef7">GPU</text>
<line x1="510" y1="350" x2="890" y2="350" stroke="#243044"/>
<rect x="536" y="336.1" width="86" height="13.9" rx="3" fill="#94a3b8"/>
<text x="579" y="316.1" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8eef7">3.2M/s</text>
<text x="579" y="329.1" font-size="10.5" text-anchor="middle" fill="#94a3b8">5.05 ms</text>
<text x="579" y="368" font-size="11.5" text-anchor="middle" fill="#e8eef7">rocFFT</text>
<text x="579" y="381" font-size="9.5" text-anchor="middle" fill="#94a3b8">ifft only — at the bandwidth limit</text>
<rect x="662" y="302.5" width="86" height="47.5" rx="3" fill="#4facfe"/>
<text x="705" y="282.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8eef7">11.1M/s</text>
<text x="705" y="295.5" font-size="10.5" text-anchor="middle" fill="#94a3b8">1.48 ms</text>
<text x="705" y="368" font-size="11.5" text-anchor="middle" fill="#e8eef7">matchedfilter</text>
<text x="705" y="381" font-size="9.5" text-anchor="middle" fill="#94a3b8">correlate + ifft + peak</text>
<rect x="788" y="100.0" width="86" height="250.0" rx="3" fill="#38ef7d"/>
<text x="831" y="80.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8eef7">58.3M/s</text>
<text x="831" y="93.0" font-size="10.5" text-anchor="middle" fill="#94a3b8">0.28 ms</text>
<text x="831" y="368" font-size="11.5" text-anchor="middle" fill="#e8eef7">matchedfilter</text>
<text x="831" y="381" font-size="11.5" text-anchor="middle" fill="#e8eef7">hierarchical</text>
<text x="831" y="394" font-size="9.5" text-anchor="middle" fill="#94a3b8">correlate + ifft + peak</text>
<text x="28" y="440" font-size="11.5" fill="#94a3b8">FFTW and rocFFT do the inverse transform ALONE; matchedfilter does the product, the transform and the peak scan.</text>
<text x="28" y="456" font-size="11.5" fill="#94a3b8">Only the peak per bin is returned, so the 537 MB of correlation is never written — on the GPU rocFFT is at the bandwidth limit (213 of 211 GB/s).</text>
</svg>