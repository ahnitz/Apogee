<text x="350" y="170" font-size="17">17 input spectra: 1 + 16</text>
<text x="350" y="220" font-size="15">Each cell computes one data–template correlation.</text>
<text x="350" y="247" font-size="15">Columns share templates; rows share data.</text>
<text x="350" y="274" font-size="15">Reuse requires the tile’s inputs to fit in cache.</text>
<text x="350" y="325" font-size="15">SIMD pair batching is separate: lanes span templates.</text>
