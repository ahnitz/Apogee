<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#121a2f" />
    </linearGradient>

    <linearGradient id="chirpGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#4facfe" />
      <stop offset="85%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>

    <linearGradient id="peakGlow" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="80%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="840" height="220" rx="16" fill="url(#bgGrad)" />

  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="60" y1="40" x2="200" y2="40" />
    <line x1="60" y1="80" x2="200" y2="80" />
    <line x1="60" y1="110" x2="200" y2="110" />
    <line x1="60" y1="140" x2="200" y2="140" />
    <line x1="60" y1="180" x2="200" y2="180" />

    <line x1="75" y1="30" x2="75" y2="190" />
    <line x1="110" y1="30" x2="110" y2="190" />
    <line x1="145" y1="30" x2="145" y2="190" />
    <line x1="180" y1="30" x2="180" y2="190" />
  </g>

  <g transform="translate(45, 20)">
    <polygon points="85,10 150,47 150,123 85,160 20,123 20,47"
             fill="none"
             stroke="#1e293b"
             stroke-width="3" />

    <polygon points="85,18 143,51 143,119 85,152 27,119 27,51"
             fill="#0d1424"
             stroke="#334155"
             stroke-width="1.5" />

    <path d="M 72,25 L 98,25 L 98,145 L 72,145 Z"
          fill="url(#peakGlow)" />

    <line x1="40" y1="110" x2="130" y2="110"
          stroke="#38bdf8"
          stroke-dasharray="3 3"
          stroke-width="1"
          opacity="0.6" />

    <path d="M 32,110
             C 42,100  48,120  56,110
             C 62,96   68,124  73,110
             C 77,88   81,132  85,28
             C 89,132  93,88   97,110
             C 102,124 108,96  114,110
             C 122,120 128,100 138,110"
          fill="none"
          stroke="url(#chirpGrad)"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <circle cx="85" cy="28" r="8" fill="#00f2fe" opacity="0.3" filter="url(#softGlow)" />
    <circle cx="85" cy="28" r="4.5" fill="#ffffff" filter="url(#glow)" />
    <circle cx="85" cy="28" r="2" fill="#00f2fe" />

    <path d="M 72,140 L 72,146 L 98,146 L 98,140"
          fill="none"
          stroke="#00f2fe"
          stroke-width="1.5"
          opacity="0.8" />
  </g>

  <g transform="translate(235, 118)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="52"
          font-weight="800"
          letter-spacing="-1.5">
      <tspan fill="#ffffff">matched</tspan>
      <tspan fill="url(#textGrad)">filter</tspan>
    </text>

    <text y="36"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="15.5"
          font-weight="400"
          letter-spacing="0.5"
          fill="#94a3b8">
      Batched frequency-domain correlation &amp; peak extraction
    </text>

    <g transform="translate(0, 52)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600">
      <rect x="0" y="0" width="108" height="20" rx="4" fill="#1e293b" />
      <text x="54" y="14" fill="#38bdf8" text-anchor="middle">AVX2 · NEON</text>

      <rect x="116" y="0" width="86" height="20" rx="4" fill="#1e293b" />
      <text x="159" y="14" fill="#38ef7d" text-anchor="middle">FP32 · PEAK</text>

      <rect x="210" y="0" width="108" height="20" rx="4" fill="#1e293b" />
      <text x="264" y="14" fill="#c084fc" text-anchor="middle">HIERARCHICAL</text>
    </g>
  </g>
</svg>
