# `pip install .` is the whole build.  There is no Makefile, and `pytest` is
# the single entry point for the suite.  The one non-Python dependency is
# Google Highway, vendored at third_party/highway.
[build-system]
# >=77 for PEP 639: the SPDX `license` expression and `license-files`
# produce Metadata 2.4.  An older setuptools reads the same lines as the
# legacy free-text form and emits different metadata.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matchedfilter"
version = "0.1.0a2"
description = "Fast single-threaded batched matched filter with peak-only output (x86-64)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.20"]
keywords = ["matched-filter", "correlation", "fft", "avx512", "signal-processing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest"]
bench = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/ahnitz/matchedfilter"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["matchedfilter"]

# Everything that ships INSIDE the package is listed here, and only here.
# setup.py also has a package_data= argument; with a pyproject build it is
# ignored, which is why the SPIR-V silently failed to ship when it was added
# there. MANIFEST.in still has to repeat these for the sdist.
#
#   *.h            the C header, so matchedfilter.include_dir() can point a
#                  compiler at it -- direct C use is not the priority, but
#                  allowing it costs nothing
#   *.txt          the measured tuning tables, read at run time
#   spirv/*        the GPU kernels, compiled ahead of time. One wheel carries
#                  every backend: no user compiles Slang, and nobody picks a
#                  wheel or installs an extra package to get the GPU path.
[tool.setuptools.package-data]
#   metal/*        the same kernels as Metal. The .metallib is what runs and
#                  is built on the macOS wheel builder, where Apple's
#                  compiler exists; the .metal source travels so a device
#                  whose library is absent can compile at load time rather
#                  than refuse.
matchedfilter = ["*.h", "*.txt", "spirv/*.spv", "spirv/manifest.json",
                 "metal/*.metal", "metal/*.metallib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# Wheels are built only for the platforms CI actually exercises.  Linux
# aarch64 is deliberately absent: it builds and passes there, but producing
# those wheels needs QEMU and is slow enough to want its own decision.  Users
# on it get the sdist, which compiles.
[tool.cibuildwheel]
# 3.14 included: the extension uses only stable C API -- PyModule_Create,
# PyArg_ParseTuple, Py_buffer, PyType_Ready -- and nothing removed in 3.12,
# 3.13 or 3.14, so there was never a reason for it to stop at 3.13 beyond
# 3.14 not existing when this list was written. CI is what verifies it;
# there are no 3.14 headers on the development machine.
#
# Free-threaded builds (cp313t, cp314t) are deliberately NOT here. The
# extension releases the GIL around the filter and would need its plan
# state auditing for concurrent use before claiming to support them.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_i686 *_i686 pp*"
build-frontend = "build"
test-requires = "pytest"
# Run from {package} so the tests import the installed wheel rather than the
# source tree next to them.
test-command = "python -m pytest {package}/tests -q -rs"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# manylinux2014's default toolchain is too old for Highway's AVX-512 targets;
# the _2_28 image ships a compiler that has them.
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# Apple Silicon only.  Intel Macs are untested -- the hosted runners for them
# are being retired -- and shipping a wheel is a stronger claim than "it
# probably compiles".  cibuildwheel sets ARCHFLAGS per wheel, which is what
# setup.py reads to decide which baseline flags are valid, so this produces
# a single-arch arm64 wheel rather than a universal2 one.
archs = ["arm64"]
