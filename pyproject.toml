# `pip install .` is the whole build.  There is no Makefile: the one C test
# that survives compiles itself from tests/test_internals.py, so `pytest` is
# the single entry point for the suite.
[build-system]
# >=77 for PEP 639: the SPDX `license` expression and `license-files`
# produce Metadata 2.4.  An older setuptools reads the same lines as the
# legacy free-text form and emits different metadata.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matchedfilter"
version = "0.1.0a1"
description = "Fast single-threaded batched matched filter with peak-only output (x86-64)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.20"]
keywords = ["matched-filter", "correlation", "fft", "avx512", "signal-processing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest"]
bench = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/ahnitz/matchedfilter"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["matchedfilter"]

# The C header ships inside the package.  Direct C use is not the priority, but
# allowing it costs nothing, so matchedfilter.include_dir() points a compiler at it.
[tool.setuptools.package-data]
matchedfilter = ["*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# Wheels are built only for the platforms CI actually exercises.  Linux
# aarch64 is deliberately absent: it builds and passes there, but producing
# those wheels needs QEMU and is slow enough to want its own decision.  Users
# on it get the sdist, which compiles.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686 *_i686 pp*"
build-frontend = "build"
test-requires = "pytest"
# Run from {package} so the tests import the installed wheel rather than the
# source tree, and so test_internals.py can still find src/ to compile against.
test-command = "python -m pytest {package}/tests -q -rs"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# manylinux2014's default toolchain is too old for the AVX-512 intrinsics the
# kernels use; the _2_28 image ships a compiler that has them.
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# Apple Silicon only.  Intel Macs are untested -- the hosted runners for them
# are being retired -- and shipping a wheel is a stronger claim than "it
# probably compiles".  cibuildwheel sets ARCHFLAGS per wheel, which is what
# setup.py reads to decide whether the x86 kernels are in the build, so this
# produces a single-arch arm64 wheel rather than a universal2 one.
archs = ["arm64"]
