[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peakfft"
version = "0.1.0"
description = "Single-threaded AVX-512 FFT specialised for finding the loudest bins"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/ahnitz/peak-fft"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["peakfft"]
