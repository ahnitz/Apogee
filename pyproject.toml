# `pip install .` is the whole build.  There is no Makefile: the one C test
# that survives compiles itself from tests/test_internals.py, so `pytest` is
# the single entry point for the suite.
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apogee"
version = "0.1.0"
description = "Single-threaded batched matched filter with peak-only output"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["numpy>=1.20"]
keywords = ["matched-filter", "correlation", "fft", "avx512", "signal-processing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest"]
bench = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/ahnitz/peak-fft"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["apogee"]

# The C header ships inside the package.  Direct C use is not the priority, but
# allowing it costs nothing, so apogee.include_dir() points a compiler at it.
[tool.setuptools.package-data]
apogee = ["*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
