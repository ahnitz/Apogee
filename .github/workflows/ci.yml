name: CI

# apogee builds as a Python extension, so the wheel job is the one that matters.
# The make-based job exists because the C tests are far more thorough than the
# Python ones and are what actually guard the kernels.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }

      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build pytest numpy
          python -m build --wheel
          python -m pip install dist/*.whl

      - name: Run the Python tests on whatever the runner supports
        run: |
          if grep -qm1 avx2 /proc/cpuinfo; then
            APOGEE_ISA=avx2 python -m pytest -q tests/test_python.py
            if grep -qm1 avx512vl /proc/cpuinfo; then
              python -m pytest -q tests/test_python.py
            fi
          else
            echo "::warning::Runner lacks AVX2; wheel built but not exercised."
          fi

      - name: The shipped header must compile on its own
        run: |
          printf '#include "apogee.h"\nint main(void){ return ap_supported(1024) ? 0 : 1; }\n' > /tmp/hdr.c
          cc -I"$(python -c 'import apogee; print(apogee.include_dir())')" \
             -fsyntax-only /tmp/hdr.c

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.11'
        with:
          name: wheel
          path: dist/*.whl

  c-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Report runner CPU
        run: |
          grep -m1 'model name' /proc/cpuinfo
          for f in avx2 avx512f avx512dq avx512bw avx512vl; do
            echo "$f: $(grep -qm1 $f /proc/cpuinfo && echo yes || echo no)"
          done

      # Explicit ISA flags rather than -march=native, so the result does not
      # depend on whichever host the runner lands on.
      - name: Build
        run: |
          make clean
          make all CC=${{ matrix.cc }} \
            CFLAGS="-O3 -mavx512f -mavx512dq -mavx512bw -mavx512vl -Wall -Wextra -Wno-unused-parameter -Werror"

      - name: Generated codelets must match gen.py
        run: |
          cp src/codelets.h /tmp/codelets.committed.h
          (cd src && python3 gen.py)
          diff -u /tmp/codelets.committed.h src/codelets.h \
            || { echo "::error::src/codelets.h is stale; re-run 'make codelets'"; exit 1; }

      - name: Run tests (AVX2 back end always; AVX-512 when the runner has it)
        run: |
          if grep -qm1 avx2 /proc/cpuinfo; then
            APOGEE_ISA=avx2 ./tests/test_binmax
            APOGEE_ISA=avx2 ./tests/test_mf
          else
            echo "::warning::Runner lacks AVX2; nothing can run natively."
          fi
          if grep -qm1 avx512vl /proc/cpuinfo; then
            ./tests/test_units
            ./tests/test_binmax
            ./tests/test_mf
            APOGEE_ISA=balanced512 ./tests/test_binmax
            APOGEE_ISA=balanced512 ./tests/test_mf
          else
            echo "::notice::Runner lacks AVX-512; that back end is built but not run here."
          fi

  # GitHub's runner pool may have no AVX-512 host, so emulate one.  Advisory:
  # SDE is fetched by scraping Intel's download page, which is not stable enough
  # to gate a merge on.
  test-under-sde:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make all CFLAGS="-O3 -mavx512f -mavx512dq -mavx512bw -mavx512vl -Wall -Wextra -Wno-unused-parameter"
      - name: Fetch Intel SDE
        run: |
          set -e
          url=$(curl -sL https://www.intel.com/content/www/us/en/developer/articles/tool/software-development-emulator.html \
                | grep -oE 'https://downloadmirror[^"]*sde-external[^"]*-lin\.tar\.xz' | head -1)
          test -n "$url"
          curl -sL "$url" -o sde.tar.xz
          mkdir sde && tar xf sde.tar.xz -C sde --strip-components=1
      - name: Run tests on an emulated Sapphire Rapids
        run: |
          ./sde/sde64 -spr -- ./tests/test_units
          ./sde/sde64 -spr -- ./tests/test_binmax
          ./sde/sde64 -spr -- ./tests/test_mf
