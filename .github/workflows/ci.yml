name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # third_party/highway
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }

      - name: Report the runner's CPU
        # Which back end runs depends entirely on this, so record it: a green
        # run on a host without AVX-512 has not exercised that path at all.
        run: |
          grep -m1 'model name' /proc/cpuinfo
          for f in avx2 avx512f avx512vl; do
            echo "$f: $(grep -qm1 $f /proc/cpuinfo && echo yes || echo no)"
          done

      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .[test]

      - name: Test
        # Run from a scratch directory so the tests import the installed
        # package rather than the source tree next to them.
        run: |
          mkdir -p /tmp/run && cd /tmp/run
          python -m pytest -q "$GITHUB_WORKSPACE/tests" -rs

      - name: Test again on every other target in the build
        # Highway's dispatch picks the widest target the host supports, so on
        # an AVX-512 runner the AVX2 and SSE4 kernels would otherwise never
        # run.  The list comes from the build rather than from here.
        if: always()
        run: |
          mkdir -p /tmp/run && cd /tmp/run
          for isa in $(python -c "import matchedfilter; print(' '.join(matchedfilter.targets()))"); do
            echo "::group::MF_ISA=$isa"
            MF_ISA=$isa python -m pytest -q "$GITHUB_WORKSPACE/tests" -rs
            echo "::endgroup::"
          done

  generated-files:
    # Both of these are committed, and both have been stale in a way that
    # produced wrong answers rather than a build error.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # third_party/highway
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet numpy scipy

      - name: src/codelets-inl.h must match src/gen.py
        run: |
          cp src/codelets-inl.h /tmp/committed.h
          (cd src && python3 gen.py)
          diff -u /tmp/committed.h src/codelets-inl.h \
            || { echo "::error::src/codelets-inl.h is stale; re-run 'python3 src/gen.py'"; exit 1; }

      - name: src/hmf_table.h must match tools/hmf_design.py
        run: |
          cp src/hmf_table.h /tmp/committed_table.h
          python3 tools/hmf_design.py emit
          diff -u /tmp/committed_table.h src/hmf_table.h \
            || { echo "::error::src/hmf_table.h is stale; re-run 'python3 tools/hmf_design.py emit'"; exit 1; }

  benchmark:
    # Advisory only.  A shared runner's timings are too noisy to margin a merge
    # on; this is here so the numbers stay visible and an order-of-magnitude
    # regression is obvious in the log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # third_party/highway
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip && python -m pip install .

      - name: Benchmark
        run: |
          cd /tmp
          python -m matchedfilter.benchmark --n 4096 16384 --data 4 --templates 16 --reps 3 \
            | tee /tmp/bench.txt

      - name: Publish to the run summary
        if: always()
        run: |
          { echo '## Benchmark'; echo; echo '```'; cat /tmp/bench.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

  wheel:
    # The same cibuildwheel path release.yml uses, on one interpreter so it
    # stays a few minutes rather than twenty.  A wheel that only builds on
    # release day is a wheel nobody has tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # third_party/highway
      - uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: cp312-manylinux_x86_64

      - name: The shipped header must compile on its own
        run: |
          python -m pip install wheelhouse/*.whl
          printf '#include "matchedfilter.h"\nint main(void){ return ap_supported(1024) ? 0 : 1; }\n' > /tmp/hdr.c
          cc -I"$(python -c 'import matchedfilter; print(matchedfilter.include_dir())')" -fsyntax-only /tmp/hdr.c

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: wheelhouse/*.whl
          if-no-files-found: error

  metal:
    name: macOS GPU (Metal)
    # macos-latest: the paravirtual Metal device is reported working there,
    # and older images returned nil from MTLCreateSystemDefaultDevice.
    runs-on: macos-latest
    timeout-minutes: 30
    # The runtime now exists but has never executed: there is no Apple
    # hardware on the development machine, so every claim about this path is
    # a claim about generated source rather than about something that ran.
    #
    # A GPU should be there. Hosted macOS runners expose an "Apple
    # Paravirtual device" -- MSL compilation and command-buffer submission
    # are reported working -- though MTLCreateSystemDefaultDevice returned
    # nil on older images, which is why the code also tries
    # MTLCopyAllDevices. Simdgroup MATRIX operations are the feature most
    # suspected of being missing on a paravirtual device; this kernel uses
    # simd_max, a plain reduction, not those.
    #
    # Still continue-on-error: whichever way it goes, the output is
    # information nobody currently has.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Slang's release carries slangc, which emits the MSL. Apple's own
      # compiler then turns it into a .metallib -- that step exists only
      # here, which is why the macOS wheel is the one that can ship one.
      - name: Fetch slangc
        run: |
          V=2026.12
          curl -fsSL -o slang.zip \
            "https://github.com/shader-slang/slang/releases/download/v${V}/slang-${V}-macos-aarch64.zip" \
            || curl -fsSL -o slang.tgz \
            "https://github.com/shader-slang/slang/releases/download/v${V}/slang-${V}-macos-aarch64.tar.gz"
          mkdir -p slangsdk
          if [ -f slang.zip ]; then unzip -q slang.zip -d slangsdk; else tar xzf slang.tgz -C slangsdk; fi
          echo "MF_SLANGC=$(find "$PWD/slangsdk" -name slangc -type f | head -1)" >> "$GITHUB_ENV"

      # The question this job exists to answer: does a hosted runner give
      # the guest a GPU at all? These are virtual machines, and a Metal
      # device is not guaranteed. Everything else here is downstream of it.
      # The question this job exists to answer: does a hosted runner give
      # the guest a GPU at all? These are virtual machines, and a Metal
      # device is not guaranteed.
      #
      # Ask BOTH ways, and note which one matters. Compute needs no
      # display, but MTLCreateSystemDefaultDevice returns the device the
      # system recommends for RENDERING and is nil with nothing attached --
      # on macos-14 it returned NULL and system_profiler reported no display
      # at all. MTLCopyAllDevices is the enumeration, and it is the one that
      # answers "is there a GPU here".
      - name: Is there actually a GPU?
        run: |
          sw_vers
          xcrun -sdk macosx metal --version || echo "no Apple metal compiler"
          echo "--- displays ---"
          system_profiler SPDisplaysDataType 2>/dev/null | head -30 || true
          echo "--- Metal ---"
          python - <<'EOF'
          import ctypes
          objc = ctypes.CDLL("/usr/lib/libobjc.dylib")
          objc.sel_registerName.restype = ctypes.c_void_p
          objc.sel_registerName.argtypes = [ctypes.c_char_p]
          m = ctypes.CDLL("/System/Library/Frameworks/Metal.framework/Metal")
          m.MTLCreateSystemDefaultDevice.restype = ctypes.c_void_p
          d = m.MTLCreateSystemDefaultDevice()
          print("MTLCreateSystemDefaultDevice ->", hex(d) if d else "NULL")

          def name_of(dev):
              send = ctypes.cast(objc.objc_msgSend,
                                 ctypes.CFUNCTYPE(ctypes.c_void_p,
                                                  ctypes.c_void_p,
                                                  ctypes.c_void_p))
              ns = send(dev, objc.sel_registerName(b"name"))
              p = send(ns, objc.sel_registerName(b"UTF8String"))
              return ctypes.cast(p, ctypes.c_char_p).value.decode() if p else "?"

          if hasattr(m, "MTLCopyAllDevices"):
              m.MTLCopyAllDevices.restype = ctypes.c_void_p
              arr = m.MTLCopyAllDevices()
              cnt = 0
              if arr:
                  cf = ctypes.cast(objc.objc_msgSend,
                                   ctypes.CFUNCTYPE(ctypes.c_ulong,
                                                    ctypes.c_void_p,
                                                    ctypes.c_void_p))
                  cnt = cf(arr, objc.sel_registerName(b"count"))
              print("MTLCopyAllDevices -> %d device(s)" % cnt)
              at = ctypes.cast(objc.objc_msgSend,
                               ctypes.CFUNCTYPE(ctypes.c_void_p,
                                                ctypes.c_void_p,
                                                ctypes.c_void_p,
                                                ctypes.c_ulong))
              for i in range(cnt):
                  dev = at(arr, objc.sel_registerName(b"objectAtIndex:"), i)
                  print("   [%d] %s" % (i, name_of(dev)))
          else:
              print("MTLCopyAllDevices is not exported")
          if d:
              print("system default is:", name_of(d))
          EOF

      - name: Build the kernels, including .metallib
        run: |
          python -m pip install -U pip numpy
          python tools/build_spirv.py
          ls -la python/matchedfilter/metal/ | head

      - name: Install and run the suite
        run: |
          python -m pip install -e . pytest
          python -c "
          import matchedfilter as mf
          for d in mf.devices():
              print(repr(d))
          from matchedfilter import _metal
          print('metal:', _metal.available())
          "
          python -m pytest tests -q

      # The end of the chain: does a shipped kernel actually run and give
      # the right answer? A failure here is the useful outcome -- it says
      # which link broke, and nothing on the development machine can.
      - name: Run a kernel on the GPU
        run: |
          python - <<'EOF'
          import numpy as np, matchedfilter as mf
          gpus = [d for d in mf.devices() if d.kind == "gpu"]
          if not gpus:
              # Say WHY, not just that. The library knows which question it
              # asked and what the answer was.
              from matchedfilter import _metal, _vulkan
              print("metal :", _metal.available()[1])
              print("vulkan:", _vulkan.available()[1])
              raise SystemExit("no GPU device was reported; nothing to run")
          n = 4096
          rng = np.random.default_rng(0)
          d = (rng.standard_normal((2, n)) + 1j*rng.standard_normal((2, n))).astype(np.complex64)
          h = (rng.standard_normal((3, n)) + 1j*rng.standard_normal((3, n))).astype(np.complex64)
          out = {}
          for dev in ("cpu", str(gpus[0])):
              f = mf.MatchedFilter(n, 2, 3, device=dev)
              f.set_data(d); f.set_templates(h)
              out[dev] = f.run(binsize=512, threshold=0.0).copy()
              print(dev, "ran")
          a, b = out["cpu"], out[str(gpus[0])]
          same = np.array_equal(a["index"], b["index"])
          err = np.max(np.abs(np.abs(a["value"]) - np.abs(b["value"])))
          print("indices match:", same, " max |value| difference:", err)
          assert same, "the Metal kernel disagreed with the CPU"
          EOF

      - name: Benchmark what runs
        run: |
          python -m matchedfilter.benchmark || true
          python tools/scoreboard.py || true
