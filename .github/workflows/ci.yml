name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # third_party/highway
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }

      - name: Report the runner's CPU
        # Which back end runs depends entirely on this, so record it: a green
        # run on a host without AVX-512 has not exercised that path at all.
        run: |
          grep -m1 'model name' /proc/cpuinfo
          for f in avx2 avx512f avx512vl; do
            echo "$f: $(grep -qm1 $f /proc/cpuinfo && echo yes || echo no)"
          done

      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .[test]

      - name: Test
        # Run from a scratch directory so the tests import the installed
        # package rather than the source tree next to them.
        run: |
          mkdir -p /tmp/run && cd /tmp/run
          python -m pytest -q "$GITHUB_WORKSPACE/tests" -rs

      - name: Test again on every other target in the build
        # Highway's dispatch picks the widest target the host supports, so on
        # an AVX-512 runner the AVX2 and SSE4 kernels would otherwise never
        # run.  The list comes from the build rather than from here.
        if: always()
        run: |
          mkdir -p /tmp/run && cd /tmp/run
          for isa in $(python -c "import matchedfilter; print(' '.join(matchedfilter.targets()))"); do
            echo "::group::MF_ISA=$isa"
            MF_ISA=$isa python -m pytest -q "$GITHUB_WORKSPACE/tests" -rs
            echo "::endgroup::"
          done

  generated-files:
    # Both of these are committed, and both have been stale in a way that
    # produced wrong answers rather than a build error.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # third_party/highway
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet numpy scipy

      - name: src/codelets-inl.h must match src/gen.py
        run: |
          cp src/codelets-inl.h /tmp/committed.h
          (cd src && python3 gen.py)
          diff -u /tmp/committed.h src/codelets-inl.h \
            || { echo "::error::src/codelets-inl.h is stale; re-run 'python3 src/gen.py'"; exit 1; }

      - name: src/hmf_table.h must match tools/hmf_design.py
        run: |
          cp src/hmf_table.h /tmp/committed_table.h
          python3 tools/hmf_design.py emit
          diff -u /tmp/committed_table.h src/hmf_table.h \
            || { echo "::error::src/hmf_table.h is stale; re-run 'python3 tools/hmf_design.py emit'"; exit 1; }

  benchmark:
    # Advisory only.  A shared runner's timings are too noisy to gate a merge
    # on; this is here so the numbers stay visible and an order-of-magnitude
    # regression is obvious in the log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # third_party/highway
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip && python -m pip install .

      - name: Benchmark
        run: |
          cd /tmp
          python -m matchedfilter.benchmark --n 4096 16384 --data 4 --templates 16 --reps 3 \
            | tee /tmp/bench.txt

      - name: Publish to the run summary
        if: always()
        run: |
          { echo '## Benchmark'; echo; echo '```'; cat /tmp/bench.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

  wheel:
    # The same cibuildwheel path release.yml uses, on one interpreter so it
    # stays a few minutes rather than twenty.  A wheel that only builds on
    # release day is a wheel nobody has tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # third_party/highway
      - uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: cp312-manylinux_x86_64

      - name: The shipped header must compile on its own
        run: |
          python -m pip install wheelhouse/*.whl
          printf '#include "matchedfilter.h"\nint main(void){ return ap_supported(1024) ? 0 : 1; }\n' > /tmp/hdr.c
          cc -I"$(python -c 'import matchedfilter; print(matchedfilter.include_dir())')" -fsyntax-only /tmp/hdr.c

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: wheelhouse/*.whl
          if-no-files-found: error
