name: Benchmark

# Runs the benchmark on every platform the library claims to support and
# combines the results into one page.  The point is not the absolute numbers --
# shared runners are noisy -- but the comparison across back ends: AVX-512,
# AVX2, and the compiler-vectorised portable path on x86, arm64 and macOS.

on:
  push:
    branches: [ main, portable ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"     # Monday, so drift in the runner fleet is visible

jobs:
  bench:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # A job that never gets a runner would otherwise sit for hours and block
    # the page build behind it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `isas` is a list because each matrix entry is a SEPARATE runner
          # VM, with its own CPU model and its own neighbours.  Comparing back
          # ends across entries compares machines as much as kernels; to
          # compare kernels they have to run in one job, on one host.
          - {os: ubuntu-latest,    label: "linux-x86_64",  isas: "auto avx2 portable"}
          - {os: ubuntu-24.04-arm, label: "linux-arm64",   isas: "auto"}
          - {os: macos-14,         label: "macos-arm64",   isas: "auto"}
          # Intel macOS is deliberately absent: the hosted fleet is retiring
          # those runners, and a platform that cannot be tested should not be
          # claimed.  It may well work -- it is the x86 kernels plus Clang --
          # but nothing here measures that.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Record what this runner actually is
        run: |
          python -c "import platform;print(platform.platform(), platform.machine())"
          if [ -r /proc/cpuinfo ]; then
            grep -m1 'model name' /proc/cpuinfo || true
            for f in avx2 avx512f avx512vl neon asimd; do
              echo "$f: $(grep -qm1 $f /proc/cpuinfo && echo yes || echo no)"
            done
          else
            sysctl -n machdep.cpu.brand_string 2>/dev/null || true
            sysctl -n hw.optional.avx2_0 2>/dev/null || true
          fi
          cc --version | head -1

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .[test]

      - name: Test and benchmark every back end on this host
        # The suite gates the benchmark: a timing of a wrong answer is
        # worthless, and the portable back end has produced wrong answers.
        run: |
          mkdir -p /tmp/run && cd /tmp/run
          for isa in ${{ matrix.isas }}; do
            if [ "$isa" = auto ]; then unset MF_ISA; name="${{ matrix.label }}"
            else export MF_ISA="$isa"; name="${{ matrix.label }}-$isa"; fi
            echo "::group::$name"
            python -m pytest -q "$GITHUB_WORKSPACE/tests" -rs
            python -m matchedfilter.benchmark \
              --n 1024 4096 16384 65536 262144 \
              --data 8 --templates 32 --reps 7 --fd 1e-3 \
              --label "$name" \
              --json "$GITHUB_WORKSPACE/bench-$name.json" \
              | tee "$GITHUB_WORKSPACE/bench-$name.txt"
            echo "::endgroup::"
          done

      - name: Publish to the run summary
        if: always()
        run: |
          for f in bench-${{ matrix.label }}*.txt; do
            [ -e "$f" ] || continue
            { echo "## $(basename "$f" .txt | sed 's/^bench-//')"; echo
              echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.label }}
          path: bench-${{ matrix.label }}*.json
          if-no-files-found: error

  page:
    name: Build the documentation page
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { pattern: bench-*, path: results, merge-multiple: true }
      - run: |
          ls -l results
          # --root so the prose comes from this checkout's README and docs/,
          # keeping the page and the source in step.
          python tools/build_report.py results --root . --out site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-page
          path: site/

      # Published only from the default branch: a page rebuilt from a PR's
      # numbers would overwrite the reference results with one-off ones.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with: { path: site/ }

  deploy:
    name: Publish
    needs: page
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
